<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TicketNow — Noche Inolvidable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-navy:#0b0f1f;
    --bg-navy-2:#11162b;
    --purple:#7c3aed;
    --purple-2:#8b5cf6;
    --purple-light:#a78bfa;
    --green:#22c55e;
    --red:#ef4444;
    --yellow:#eab308;
    --gray:#4b5563;
    --panel:#151a30;
    --panel-border:#232a45;
    --text:#e8eaf5;
    --text-dim:#9099b8;
    --white:#ffffff;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:#f3f4f9;color:var(--text);}
  h1,h2,h3,.brand{font-family:'Sora',sans-serif;}

  /* ---------- HEADER ---------- */
  header{
    background:var(--bg-navy);
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 32px;
    border-bottom:1px solid var(--panel-border);
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--white);}
  .brand .logo{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(135deg,var(--purple),#ec4899);
    display:flex;align-items:center;justify-content:center;font-size:16px;
  }
  .brand .sub{display:block;font-size:10px;font-weight:500;letter-spacing:1.5px;color:var(--text-dim);}
  nav{display:flex;gap:28px;}
  nav a{color:var(--text-dim);text-decoration:none;font-size:13px;font-weight:600;letter-spacing:.3px;display:flex;gap:6px;align-items:center;}
  nav a.active{color:var(--white);}
  .header-right{display:flex;align-items:center;gap:16px;}
  .cart-btn{position:relative;background:var(--panel);border:1px solid var(--panel-border);width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text);}
  .cart-badge{position:absolute;top:-6px;right:-6px;background:var(--purple);color:#fff;font-size:11px;font-weight:700;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;}
  .account{background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;padding:8px 14px;color:var(--text);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;}

  /* ---------- HERO ---------- */
  .hero{background:var(--bg-navy);padding:20px 32px 28px;display:flex;gap:20px;flex-wrap:wrap;}
  .hero-event{display:flex;gap:16px;align-items:center;flex:1;min-width:280px;}
  .hero-thumb{width:120px;height:80px;border-radius:10px;background:linear-gradient(160deg,#1e2340,#3b1550);position:relative;overflow:hidden;flex-shrink:0;}
  .hero-thumb::after{content:"🎤";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;opacity:.85;}
  .eyebrow{color:var(--purple-light);font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
  .hero-event h1{color:#fff;font-size:26px;margin:4px 0 8px;}
  .hero-meta{color:var(--text-dim);font-size:13px;display:flex;flex-direction:column;gap:4px;}
  .stat-card{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:14px 20px;min-width:170px;}
  .stat-label{display:flex;align-items:center;gap:6px;color:var(--text-dim);font-size:12px;font-weight:600;margin-bottom:6px;}
  .stat-value{font-size:26px;font-weight:800;color:#fff;}
  .stat-value.green{color:var(--green);}
  .stat-sub{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .stats-row{display:flex;gap:14px;flex-wrap:wrap;}
  .dot-live{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 1.4s infinite;}
  @keyframes pulse{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}

  /* ---------- MAIN LAYOUT ---------- */
  .layout{display:grid;grid-template-columns:270px 1fr 300px;gap:20px;padding:24px 32px;align-items:start;}
  @media (max-width:1100px){.layout{grid-template-columns:1fr;}}
  .panel{background:#fff;border:1px solid #e6e8f0;border-radius:16px;padding:18px;color:#20233a;}
  .panel h3{font-size:13px;margin:0 0 14px;display:flex;align-items:center;gap:8px;color:#20233a;}
  .step-num{background:var(--purple);color:#fff;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}

  .sector-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;}
  .sector-btn{grid-column:span 2;background:#f4f5fa;border:1px solid #e6e8f0;border-radius:9px;padding:10px;font-size:12.5px;font-weight:700;color:#3a3f5c;cursor:pointer;text-align:center;}
  .sector-grid .sector-btn:not(:first-child){grid-column:span 1;}
  .sector-btn.active{background:var(--purple);color:#fff;border-color:var(--purple);}

  .legend-item{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#4a4f6c;margin-bottom:9px;}
  .legend-dot{width:13px;height:13px;border-radius:3px;}

  .info-box{background:#f4f5fa;border-radius:12px;padding:14px;font-size:12px;color:#4a4f6c;margin-top:16px;display:flex;gap:10px;}

  /* ---------- SEAT MAP ---------- */
  .map-panel{padding:22px;}
  .stage{
    background:#1a1f36;color:#fff;text-align:center;padding:12px;border-radius:10px;
    font-weight:800;letter-spacing:3px;font-size:13px;max-width:420px;margin:0 auto 22px;
  }
  .seatmap{display:flex;flex-direction:column;align-items:center;gap:18px;}
  .sector-block{width:100%;}
  .sector-name{text-align:center;font-size:11px;font-weight:800;letter-spacing:2px;color:#8b8fae;margin-bottom:8px;}
  .rows{display:flex;flex-direction:column;gap:4px;align-items:center;}
  .row{display:flex;gap:4px;}
  .seat{
    width:14px;height:14px;border-radius:3px;cursor:pointer;
    transition:transform .1s ease;
    position:relative;
  }
  .seat:hover{transform:scale(1.25);}
  .seat.available{background:var(--green);}
  .seat.sold{background:var(--red);cursor:not-allowed;}
  .seat.selected{background:var(--yellow);}
  .seat.mine{outline:2px solid #111827;}
  .palcos-row{display:flex;justify-content:space-between;width:100%;max-width:520px;}
  .hint{text-align:center;color:#8b8fae;font-size:12px;margin-top:18px;}

  .tooltip{
    position:absolute;background:#fff;border:1px solid #e6e8f0;border-radius:10px;
    padding:10px 12px;box-shadow:0 10px 30px rgba(20,20,50,.15);font-size:12.5px;z-index:20;
    width:170px;
  }
  .tooltip b{display:block;font-size:13px;margin-bottom:2px;}
  .tooltip .price{font-weight:800;font-size:15px;margin:4px 0 8px;}
  .tooltip button{width:100%;background:var(--purple);color:#fff;border:none;border-radius:8px;padding:7px;font-weight:700;font-size:12.5px;cursor:pointer;}

  /* ---------- CART ---------- */
  .cart-item{background:#f4f5fa;border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;}
  .cart-item .sec{color:var(--purple);font-size:11.5px;font-weight:700;}
  .cart-item .row-seat{font-size:13px;font-weight:600;color:#20233a;margin:2px 0;}
  .cart-item .price{font-size:12.5px;color:#4a4f6c;}
  .remove-btn{background:#fde8e8;color:var(--red);border:none;border-radius:6px;width:22px;height:22px;cursor:pointer;font-weight:700;}
  .cart-empty{font-size:12.5px;color:#8b8fae;text-align:center;padding:20px 0;}
  .totals-row{display:flex;justify-content:space-between;font-size:13px;color:#4a4f6c;margin:6px 0;}
  .total-row{display:flex;justify-content:space-between;font-size:16px;font-weight:800;color:#20233a;margin:10px 0;padding-top:10px;border-top:1px solid #e6e8f0;}
  .buy-btn{width:100%;background:var(--purple);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
  .buy-btn:disabled{background:#c7c9db;cursor:not-allowed;}
  .timer-box{background:#f4f5fa;border-radius:10px;padding:10px 12px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#4a4f6c;}
  .timer-val{font-weight:800;color:#20233a;}
  .conn-badge{position:fixed;bottom:16px;right:16px;background:#111827;color:#fff;font-size:11.5px;padding:8px 14px;border-radius:999px;display:flex;align-items:center;gap:7px;box-shadow:0 8px 20px rgba(0,0,0,.25);}
  .conn-dot{width:8px;height:8px;border-radius:50%;}
  .conn-dot.ok{background:var(--green);}
  .conn-dot.bad{background:var(--red);}
</style>
</head>
<body>
<div id="root"></div>

<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
